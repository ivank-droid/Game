name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - name: Python packages
        run: pip install --upgrade "buildozer==1.5.0" "cython==0.29.37" virtualenv setuptools
      - name: Build
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
      - name: Show end of log
        if: failure()
        run: |
          echo "=== ERRORS ==="
          grep -n -i -E "error|failed|fatal" build.log | tail -n 25
          echo "=== LAST 50 LINES ==="
          tail -n 50 build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gamecenter-result
          path: |
            bin/*.apk
            build.log
